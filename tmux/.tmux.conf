# ~/.tmux.conf
# Kept for when tmux is needed; not linked by default (dots stow tmux).
# Colors come from dots theme. Prefix: Ctrl-a.

unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind r source-file ~/.tmux.conf \; display-message "Reloaded"

# Terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:clipboard:focus:extkeys"
set -g set-clipboard on
set -g focus-events on
set -sg escape-time 10

# Behaviour
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# New panes and windows keep the current folder
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Move: Alt-hjkl without prefix. Resize: prefix + HJKL.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Windows
bind -r n next-window
bind -r p previous-window
bind Tab last-window
bind x confirm-before -p "kill pane #P? (y/n)" kill-pane

# Copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Look
set -g status-style "bg=default,fg=#6c7086"
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[default] "
set -g status-right "#[fg=#6c7086]%H:%M"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#f5c2e7,bold] #I:#W "
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#cba6f7,fg=#1e1e2e,bold"

# Written by dots theme.
source-file -q ~/.config/tmux/theme.conf

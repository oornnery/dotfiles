onboarding = false
[ui]
agent_panel_scope = "all"

show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
[ui.toast]
delivery = "system"

[experimental]
pane_history = true

[theme]
name = "catppuccin"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "Navigate workspaces, sessions, projects"

[[keys.command]]
key = "prefix+shift+t"
type = "plugin_action"
command = "herdr-navigator.open-side"
description = "Open navigator in side pane"

[[keys.command]]
key = "prefix+l"
type = "plugin_action"
command = "herdr-navigator.jump-back"
description = "Jump back to previous workspace"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "sessionizer.open"
description = "Open project workspace"

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "sessionizer.worktree-open"
description = "Open git worktree workspace"

[[keys.command]]
key = "prefix+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "Toggle code review pane"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "nicosuave.memex.palette"
description = "Search agent session history"

[[keys.command]]
key = "prefix+alt+t"
type = "plugin_action"
command = "tab-smart-rename.rename-now"
description = "Rename current tab"

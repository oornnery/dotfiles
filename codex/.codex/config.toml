model = "gpt-6-astra"
model_reasoning_effort = "medium"
approvals_reviewer = "auto_review"

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

[mcp_servers.cavemem]
command = "fnm"
args = ["exec", "--using=22", "--", "cavemem", "mcp"]
enabled = true
default_tools_approval_mode = "writes"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true
default_tools_approval_mode = "auto"

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@0.0.78"]
enabled = true
default_tools_approval_mode = "writes"

[mcp_servers.chrome_devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@1.8.0", "--headless", "--isolated", "--no-usage-statistics", "--no-performance-crux"]
env = { CHROME_DEVTOOLS_MCP_NO_UPDATE_CHECKS = "1" }
enabled = true
startup_timeout_sec = 60
default_tools_approval_mode = "prompt"

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_MCP_TOKEN"
http_headers = { "X-MCP-Toolsets" = "repos,issues,pull_requests,actions" }
enabled = true
default_tools_approval_mode = "prompt"

[mcp_servers.cloudflare]
url = "https://mcp.cloudflare.com/mcp"
enabled = true
default_tools_approval_mode = "prompt"

[projects."/home/oornnery/friday-os"]
trust_level = "trusted"

[projects."/home/oornnery/dotfiles"]
trust_level = "trusted"

[projects."/home/oornnery/proj/voicelab"]
trust_level = "trusted"

[projects."/home/oornnery/proj/no-jinjax"]
trust_level = "trusted"

[projects."/home/oornnery"]
trust_level = "trusted"

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch"]
status_line_use_colors = true

[tui.model_availability_nux]
gpt-6-astra = 1

[features]
hooks = true


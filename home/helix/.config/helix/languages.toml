# Only what differs from Helix's defaults (`helix --health` lists them).

[language-server.ruff]
command = "uvx"
args = ["ruff", "server"]

[[language]]
name = "python"
language-servers = [
  { name = "ruff", except-features = ["hover"] },
  "basedpyright",
  "lsp-ai"
]
auto-format = true

# lsp-ai: LLMs through OpenRouter, one key (OPENROUTER_API_KEY in ~/.config/ai/env).
# `config` is sent as the server's initializationOptions. OpenRouter has no FIM
# endpoint, so completion asks a small chat model for the text at <CURSOR>.
# Chat: type "!C" and your question, then Space-a. Models and prices: dots help ai.
[language-server.lsp-ai]
command = "lsp-ai"

[language-server.lsp-ai.config.memory.file_store]

[language-server.lsp-ai.config.models.fast]
type = "open_ai"
chat_endpoint = "https://openrouter.ai/api/v1/chat/completions"
model = "deepseek/deepseek-v4-flash"
auth_token_env_var_name = "OPENROUTER_API_KEY"

[language-server.lsp-ai.config.models.smart]
type = "open_ai"
chat_endpoint = "https://openrouter.ai/api/v1/chat/completions"
model = "anthropic/claude-haiku-5.5"
auth_token_env_var_name = "OPENROUTER_API_KEY"

[language-server.lsp-ai.config.completion]
model = "fast"

[language-server.lsp-ai.config.completion.parameters]
max_context = 1024
max_tokens = 64
messages = [
  { role = "system", content = "Complete the code at <CURSOR>. Reply with only the text to insert: no explanation, no code fences." },
  { role = "user", content = "{CODE}" },
]

[[language-server.lsp-ai.config.chat]]
trigger = "!C"
action_display_name = "Chat"
model = "smart"
parameters = { max_context = 4096, max_tokens = 1024, messages = [{ role = "system", content = "You are a code assistant. Answer succinctly and accurately." }] }

# Servers that follow each language's default, plus lsp-ai.
[[language]]
name = "rust"
language-servers = ["rust-analyzer", "lsp-ai"]

[[language]]
name = "go"
language-servers = ["gopls", "golangci-lint-langserver", "lsp-ai"]

[[language]]
name = "javascript"
language-servers = ["typescript-language-server", "lsp-ai"]

[[language]]
name = "typescript"
language-servers = ["typescript-language-server", "lsp-ai"]

[[language]]
name = "lua"
language-servers = ["lua-language-server", "lsp-ai"]

[[language]]
name = "bash"
language-servers = ["bash-language-server", "lsp-ai"]

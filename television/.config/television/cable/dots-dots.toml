# A mode of dots palette, which gives the lines and the preview. Tab shows the others.
[metadata]
name = "dots-dots"
description = "dots commands"

[source]
command = "dots palette --rows dots"
no_sort = true
frecency = false
display = "{split: :1..}"

[preview]
command = "dots palette --preview '{split: :0}' '{split: :1}'"

[keybindings]
tab = "toggle_remote_control"

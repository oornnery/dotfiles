# Square ends instead of round ones, on the tabs, the cursor and the status bar.
# A full block takes the color of what it closes. The rest is the default theme.
[tabs]
sep_inner = { open = "█", close = "█" }
sep_outer = { open = "█", close = "█" }

[indicator]
padding = { open = "█", close = "█" }

[status]
sep_left  = { open = "█", close = "█" }
sep_right = { open = "█", close = "█" }

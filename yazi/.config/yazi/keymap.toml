# Yazi keeps its own keys (~ lists them). Only these additions: a shell in the
# folder you are in. Inside Zellij it is a new pane or tab; outside, it runs
# right here and `exit` comes back to yazi.
[mgr]
prepend_keymap = [
    { on = "W", run = 'shell --block "dots pane"', desc = "Shell here, as a pane in Zellij" },
    { on = "T", run = 'shell --block "dots pane --tab"', desc = "Shell here, as a tab in Zellij" },
]
